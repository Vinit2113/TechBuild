<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up</title>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap");
    </style>

    <link rel="stylesheet" href="fonts.css" />

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="./css/sign-up.css" />
</head>
<body class="min-h-screen w-screen flex justify-center items-center">

<video autoplay muted loop class="bg-video">
    <source src="./videos/sign-up-video/gfx-video-background.mp4" type="video/mp4">
</video>

    <div class="container w-[590px] my-5 rounded-xl">
        <form action="">

      
        <h1 class="text-center text-4xl font-bold mb-10">Sign Up Now</h1>
        <div class="input-split-box  my-8 h-[45px] w-full flex justify-between gap-3">
            <div class="left-split-box flex flex-col w-1/2 relative">
                <input type="text" name="" id="" placeholder=" " required class="textbox h-full outline-none p-5 pr-12 pr-6 rounded-3xl">
                <label for="" class="text-[15px]">First name</label>
            </div>
            <div class="right-split-box flex flex-col w-1/2 relative">
                <input type="text" name="" id="" placeholder=" " required class="textbox h-full w-full outline-none p-5 pr-12 pr-6 rounded-3xl">
                <label for="" class="text-[15px]">Last name</label>
            </div>
        </div>
        <div class="input-box  my-8 h-[40px] flex flex-col ">
            <input type="email" name="" id="eid" placeholder=" " required class="textbox h-full w-full outline-none p-5 pr-12 pr-6 rounded-3xl">
            <label for="" class="float-label text-[15px]">Email</label>
        </div>
        <div class="input-box  my-8 h-[40px] flex flex-col ">
            <input type="tel" pattern="[0-9]{10}" placeholder=" " required maxlength="10" class="textbox h-full w-full outline-none p-5 pr-12 pr-6 rounded-3xl">
            <label for="" class="float-label text-[15px]">Phone number</label>
        </div>
        <div class="input-box  my-8 h-[40px] flex flex-col ">
            <input type="password" name="" id="eid" placeholder=" " required class="textbox h-full w-full outline-none p-5 pr-12 pr-6 rounded-3xl">
            <label for="" class="float-label text-[15px]">Password</label>
        </div>
        <p class="-mt-5 mb-5 ml-3 text-xs">use atlest 8 or more characters with mix of letters, numbers & symbols</p>
        <div class="checkbox-box ml-2  flex items-center gap-2 my-6 h-[30px] w-full">
            <input type="checkbox">
            <p class="text-sm">By creating an account, I agree to the <a href="#" class="hover:underline">Terms of use</a> and <a href="#" class="hover:underline">privacy policy</a> </p>
        </div>

        <div class="btn-box mb-3">
            <button type="submit"
            class="signup-btn relative w-full h-full py-2 px-3 rounded-3xl font-semibold text-white bg-black overflow-hidden">
            Sign up
            </button>  
        </div>
        <div class="link-box flex justify-center">
            <p>Already have an acount? <a href="#" class=" font-bold hover:underline">Login</a></p>
        </div>
          </form>
    </div>
</body>
</html>
