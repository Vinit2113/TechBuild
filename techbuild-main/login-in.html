<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap");
    </style>

    <link rel="stylesheet" href="fonts.css" />

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="./css/login-in.css" />
</head>

<body class="min-h-screen w-screen flex justify-center items-center">
    <div class="container relative w-[450px] flex flex-col px-[30px] py-[40px]">
        <form>
            <h1 class="text-center text-3xl font-bold mb-6">Login</h1>

            <!-- Email -->
            <div class="input-box h-[50px] w-full my-7 relative">
                <input type="email" placeholder="Email ID" required
                    class="email w-full h-full bg-transparent border-2 border-[#FFFFFF33] outline-none rounded-3xl p-5 pr-12 text-base" />

                <i class="ri-user-fill absolute right-5 top-3"></i>
            </div>

            <!-- Password -->
            <div class="input-box h-[50px] w-full my-7 relative">
                <input type="password" placeholder="Password" required
                    class="password w-full h-full bg-transparent border-2 border-[#FFFFFF33] outline-none rounded-3xl p-5 pr-12 text-base" />

                <i class="ri-lock-fill absolute right-5 top-3"></i>
            </div>

            <!-- Remember -->
            <div class="remember-me-forget-box -mt-2 mb-6 flex justify-between items-center text-sm">
                <div class="remember-me flex items-center gap-2">
                    <input type="checkbox" id="remember-me" />
                    <label for="remember-me" class="cursor-pointer">Remember me</label>
                </div>

                <a href="#" class="hover:underline">Forget Password?</a>
            </div>

            <!-- Button -->
            <button class="login-btn relative overflow-hidden w-full p-2 rounded-3xl font-semibold group mb-6 text-white transition-all duration-300 ease-in-out hover:scale-105 hover:shadow-[0_0_20px_#B026FF,0_0_50px_#B026FF]">
                
                <span
                    class="absolute inset-0 bg-gradient-to-r from-black to-[#B026FF] scale-x-0 origin-left transition-transform duration-700 ease-in-out group-hover:scale-x-100">
                </span>

                <span class="relative z-10"> Login </span>
            </button>

            <!-- Register -->
            <div class="register-box flex justify-center">
                <p>
                    Don't have an account?
                    <a href="#" class="font-bold hover:underline">Register</a>
                </p>
            </div>
        </form>
    </div>
</body>

</html>
